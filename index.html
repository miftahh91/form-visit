<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Operasional Teknisi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2, h3 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        select, input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        
        .view-section { display: none; }
        .view-section.active { display: block; }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .menu-card { background: #3498db; color: white; padding: 20px; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .menu-card:hover { background: #2980b9; transform: translateY(-2px); }
        .menu-card.uats { background: #e67e22; }
        .menu-card.pendampingan { background: #27ae60; }

        .btn-submit { background-color: #2c3e50; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-back { background-color: #95a5a6; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
        
        .section-log { margin-top: 40px; border-top: 2px solid #eee; padding-top: 20px; }
        .log-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .btn-export { background-color: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #7f8c8d; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .top-bar a { color: #3498db; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div>Login: <strong id="activeTechnician">-</strong></div>
        <div>Mode: <span id="userRole">Teknisi</span> | <a id="adminToggle" onclick="toggleAdmin()">Login Admin</a></div>
    </div>

    <!-- VIEW 1: LOGIN -->
    <div id="viewLogin" class="view-section active">
        <h2>Login Teknisi Lapangan</h2>
        <div class="form-group" style="max-width: 400px; margin: 0 auto;">
            <label for="loginTeknisi">Pilih Nama Anda</label>
            <select id="loginTeknisi" class="form-group">
                <option value="">-- Pilih Nama Teknisi --</option>
                <option value="Agung">Agung</option>
                <option value="Aji">Aji</option>
                <option value="Eko">Eko</option>
                <option value="Miftah">Miftah</option>
                <option value="Rifki">Rifki</option>
            </select>
            <button type="button" class="btn-submit" onclick="prosesLogin()">Masuk Dashboard</button>
        </div>
    </div>

    <!-- VIEW 2: DASHBOARD -->
    <div id="viewDashboard" class="view-section">
        <h2>Dashboard Teknisi</h2>
        <div class="menu-grid">
            <div class="menu-card" onclick="pilihForm('Form Visit')">📋 Form Visit</div>
            <div class="menu-card pendampingan" onclick="pilihForm('Form Pendampingan')">🤝 Form Pendampingan</div>
            <div class="menu-card uats" onclick="pilihForm('Form UAT')">✅ Form UAT</div>
        </div>

        <div class="section-log">
            <div class="log-header">
                <h3>Rekap Log Aktivitas Terpusat</h3>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="month" id="filterBulan" onchange="renderTable()">
                    <button id="btnExport" class="btn-export" onclick="exportExcel()">Unduh Excel</button>
                </div>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Waktu</th>
                            <th>Kategori</th>
                            <th>Tanggal</th>
                            <th>Teknisi</th>
                            <th>Lokasi / Instansi</th>
                            <th>Detail / PIC</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody">
                        <tr><td colspan="6" style="text-align: center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- VIEW 3: FORM DINAMIS -->
    <div id="viewForm" class="view-section">
        <button class="btn-back" onclick="kembaliKeDashboard()">← Kembali ke Dashboard</button>
        <h2 id="formTitle">Formulir</h2>

        <form id="dynamicForm" onsubmit="submitForm(event)">
            <div class="form-group">
                <label for="lokasi" id="labelLokasi">Lokasi Visit</label>
                <select id="lokasi" required>
                    <option value="">-- Pilih Lokasi --</option>
                    <option value="Wisma Mulia 2">Wisma Mulia 2</option>
                    <option value="Sorong PSO">Sorong PSO</option>
                    <option value="Cakung Hub">Cakung Hub</option>
                    <option value="Telkom Landmark">Telkom Landmark</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tanggal">Tanggal Kegiatan</label>
                <input type="date" id="tanggal" required>
            </div>

            <!-- Field Tambahan Khusus Visit & UAT -->
            <div id="picFields">
                <div class="form-group">
                    <label for="pic">Nama PIC</label>
                    <input type="text" id="pic" placeholder="Nama PIC di lokasi">
                </div>
                <div class="form-group">
                    <label for="telp">No Telepon PIC</label>
                    <input type="tel" id="telp" placeholder="08xxxxxxxxxx">
                </div>
                <div class="form-group">
                    <label for="email">Email PIC</label>
                    <input type="email" id="email" placeholder="email@domain.com">
                </div>
            </div>

            <!-- Field Tambahan Khusus Pendampingan -->
            <div id="pendampinganFields" style="display: none;">
                <div class="form-group">
                    <label for="detail">Nama / Deskripsi Kegiatan</label>
                    <textarea id="detail" rows="3" placeholder="Tuliskan detail kegiatan pendampingan..."></textarea>
                </div>
            </div>

            <button type="submit" class="btn-submit">Kirim Data & Telegram</button>
        </form>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT DI SINI:
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxn2K-6TO-hy6qcVNEhp83GHXGDQoXEkA4_rB7gqBc/dev";
    
    // Konfigurasi Telegram (Opsional, sesuaikan jika ingin aktif)
    const TELEGRAM_BOT_TOKEN = "8886255384:AAGaf0Rcdu5-I9O-wFXOixyk3rlSRBwgY0s";
    const TELEGRAM_CHAT_ID = "645887429";

    let currentUser = "";
    let currentKategori = "";
    let logData = [];

    window.onload = function() {
        document.getElementById('filterBulan').value = new Date().toISOString().slice(0, 7);
        fetchDataFromCloud();
    };

    function prosesLogin() {
        const nama = document.getElementById('loginTeknisi').value;
        if (!nama) { alert("Pilih nama dulu!"); return; }
        currentUser = nama;
        document.getElementById('activeTechnician').innerText = currentUser;
        gantiView('viewDashboard');
        fetchDataFromCloud();
    }

    function gantiView(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
    }

    function pilihForm(kategori) {
        currentKategori = kategori;
        document.getElementById('formTitle').innerText = kategori;
        document.getElementById('dynamicForm').reset();

        if (kategori === 'Form Pendampingan') {
            document.getElementById('labelLokasi').innerText = "Lokasi Kegiatan";
            document.getElementById('picFields').style.display = 'none';
            document.getElementById('pendampinganFields').style.display = 'block';
            document.getElementById('pic').removeAttribute('required');
            document.getElementById('telp').removeAttribute('required');
            document.getElementById('email').removeAttribute('required');
            document.getElementById('detail').setAttribute('required', 'true');
        } else {
            document.getElementById('labelLokasi').innerText = "Lokasi Visit";
            document.getElementById('picFields').style.display = 'block';
            document.getElementById('pendampinganFields').style.display = 'none';
            document.getElementById('pic').setAttribute('required', 'true');
            document.getElementById('telp').setAttribute('required', 'true');
            document.getElementById('email').setAttribute('required', 'true');
            document.getElementById('detail').removeAttribute('required');
        }

        gantiView('viewForm');
    }

    function kembaliKeDashboard() {
        gantiView('viewDashboard');
        fetchDataFromCloud();
    }

    function fetchDataFromCloud() {
        if (WEB_APP_URL.includes("SALIN_URL")) return;
        fetch(WEB_APP_URL)
            .then(res => res.json())
            .then(data => {
                logData = data;
                renderTable();
            })
            .catch(err => console.error(err));
    }

    function submitForm(e) {
        e.preventDefault();
        const now = new Date();
        const timestamp = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID');

        const payload = {
            timestamp: timestamp,
            kategori: currentKategori,
            tanggal: document.getElementById('tanggal').value,
            teknisi: currentUser,
            lokasi: document.getElementById('lokasi').value,
            pic: document.getElementById('pic').value,
            telp: document.getElementById('telp').value,
            email: document.getElementById('email').value,
            detail: document.getElementById('detail').value
        };

        // 1. Kirim ke Google Sheets
        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            // 2. Kirim ke Telegram
            kirimTelegram(payload);

            alert(`${currentKategori} berhasil dikirim ke Sheets & Telegram!`);
            kembaliKeDashboard();
        }).catch(err => alert("Gagal mengirim data."));
    }

    function kirimTelegram(data) {
        if (TELEGRAM_BOT_TOKEN.includes("GANTI")) return;

        let pesanDetail = "";
        if (data.kategori === "Form Pendampingan") {
            pesanDetail = `📝 *Kegiatan:* ${data.detail}`;
        } else {
            pesanDetail = `👤 *PIC:* ${data.pic} (${data.telp})\n📧 *Email:* ${data.email}`;
        }

        const pesan = `🚨 *NOTIFIKASI ${data.kategori.toUpperCase()}* 🚨\n\n` +
                      `👨‍💻 *Teknisi:* ${data.teknisi}\n` +
                      `🏢 *Lokasi:* ${data.lokasi}\n` +
                      `📅 *Tanggal:* ${data.tanggal}\n` +
                      `${pesanDetail}\n\n` +
                      `⏰ *Waktu:* ${data.timestamp}`;
        
        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: pesan, parse_mode: 'Markdown' })
        }).catch(err => console.log(err));
    }

    function renderTable() {
        const filterBulan = document.getElementById('filterBulan').value;
        const tbody = document.getElementById('logTableBody');
        tbody.innerHTML = '';

        const filtered = logData.filter(i => i.tanggal && i.tanggal.startsWith(filterBulan));
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Tidak ada data bulan ini</td></tr>';
            return;
        }

        filtered.forEach(i => {
            const detailInfo = i.kategori === 'Form Pendampingan' ? `Kegiatan: ${i.detail}` : `PIC: ${i.pic} (${i.telp})`;
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${i.timestamp}</td>
                <td><b>${i.kategori}</b></td>
                <td>${i.tanggal}</td>
                <td>${i.teknisi}</td>
                <td>${i.lokasi}</td>
                <td>${detailInfo}</td>
            `;
            tbody.appendChild(row);
        });
    }

    function toggleAdmin() {
        const role = document.getElementById('userRole');
        const btn = document.getElementById('btnExport');
        if (role.innerText.includes('Teknisi')) {
            if (prompt("Sandi Admin:") === "admin123") {
                role.innerText = "Admin";
                btn.style.display = "inline-block";
            } else { alert("Sandi salah!"); }
        } else {
            role.innerText = "Teknisi";
            btn.style.display = "none";
        }
    }

    function exportExcel() {
        const filterBulan = document.getElementById('filterBulan').value;
        const filtered = logData.filter(i => i.tanggal && i.tanggal.startsWith(filterBulan));
        if (filtered.length === 0) { alert("Tidak ada data."); return; }

        let csv = "data:text/csv;charset=utf-8,Waktu;Kategori;Tanggal;Teknisi;Lokasi;PIC/Detail\r\n";
        filtered.forEach(i => {
            csv += `"${i.timestamp}";"${i.kategori}";"${i.tanggal}";"${i.teknisi}";"${i.lokasi}";"${i.pic || i.detail}"\r\n`;
        });
        const link = document.createElement("a");
        link.href = encodeURI(csv);
        link.download = `Rekap_Log_${filterBulan}.csv`;
        link.click();
    }
</script>

</body>
</html>
