<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Visit Teknisi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .btn-submit { background-color: #3498db; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-submit:hover { background-color: #2980b9; }
        
        .section-log { margin-top: 40px; border-top: 2px solid #eee; padding-top: 20px; }
        .log-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .btn-export { background-color: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; display: none; } /* Tersembunyi default untuk teknisi */
        .btn-export:hover { background-color: #219653; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .admin-login-box { text-align: right; margin-bottom: 15px; font-size: 12px; color: #7f8c8d; }
        .admin-login-box a { color: #3498db; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="admin-login-box">
        Mode: <span id="userRole">Teknisi Lapangan</span> | <a id="adminToggle" onclick="toggleAdmin()">Login Admin</a>
    </div>

    <h2>Formulir Visit Teknisi</h2>
    
    <form id="visitForm">
        <div class="form-group">
            <label for="teknisi">Nama Teknisi</label>
            <select id="teknisi" required>
                <option value="">-- Pilih Nama Teknisi --</option>
                <option value="Agung">Agung</option>
                <option value="Aji">Aji</option>
                <option value="Eko">Eko</option>
                <option value="Miftah">Miftah</option>
                <option value="Rifki">Rifki</option>
            </select>
        </div>

        <div class="form-group">
            <label for="lokasi">Lokasi Visit</label>
            <select id="lokasi" required>
                <option value="">-- Pilih Lokasi Visit --</option>
                <option value="Wisma Mulia 2">KOJK PROV JAWA BARAT</option>
                <option value="Sorong PSO">KOJK PROV JAWA TENGAH</option>
                <option value="Cakung Hub">KOJK PROV JAWA TIMUR</option>
                <option value="Telkom Landmark">Telkom Landmark</option>
            </select>
        </div>

        <div class="form-group">
            <label for="tanggal">Tanggal Visit</label>
            <input type="date" id="tanggal" required>
        </div>

        <div class="form-group">
            <label for="pic">Nama PIC (Person In Charge)</label>
            <input type="text" id="pic" placeholder="Contoh: Rifki" required>
        </div>

        <div class="form-group">
            <label for="telp">Nomor Telepon PIC</label>
            <input type="tel" id="telp" placeholder="Contoh: 08123456789" required>
        </div>

        <div class="form-group">
            <label for="email">Email PIC</label>
            <input type="email" id="email" placeholder="Contoh: pic@email.com" required>
        </div>

        <button type="submit" class="btn-submit">Submit</button>
    </form>

    <div class="section-log">
        <div class="log-header">
            <h3>Log Pengisian (Database Cloud)</h3>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="month" id="filterBulan" onchange="renderTable()">
                <button id="btnExport" class="btn-export" onclick="exportExcel()">Unduh Excel</button>
            </div>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Waktu Input</th>
                        <th>Tgl Visit</th>
                        <th>Teknisi</th>
                        <th>Lokasi</th>
                        <th>PIC</th>
                        <th>Telp PIC</th>
                        <th>Email PIC</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    <tr><td colspan="7" style="text-align: center;">Memuat data dari database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT KAMU DI SINI:
    // ==========================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby7jtypa_d5jXLMxDWmVdfGZnmvLzC6gEvngW1QH0DssmZ3P-MzkG6PtcmaiM0sh7mP/exec";

    // Konfigurasi Telegram Bot (Ganti token & chat_id sesuai project sebelumnya jika perlu)
    const TELEGRAM_BOT_TOKEN = "8886255384:AAGaf0Rcdu5-I9O-wFXOixyk3rlSRBwgY0s";
    const TELEGRAM_CHAT_ID = "645887429";

    let logData = [];

    // Ambil data saat halaman dimuat
    window.onload = function() {
        document.getElementById('filterBulan').value = new Date().toISOString().slice(0, 7);
        fetchDataFromCloud();
    };

    // Fungsi Mengambil Data dari Google Sheets
    function fetchDataFromCloud() {
        if (WEB_APP_URL.includes("SALIN_URL")) {
            document.getElementById('logTableBody').innerHTML = '<tr><td colspan="7" style="text-align: center; color: red;">URL Google Apps Script belum diatur di dalam kode!</td></tr>';
            return;
        }

        fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                logData = data;
                renderTable();
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('logTableBody').innerHTML = '<tr><td colspan="7" style="text-align: center; color: red;">Gagal memuat data dari database cloud.</td></tr>';
            });
    }

    // Submit Form
    document.getElementById('visitForm').addEventListener('submit', function(e) {
        e.preventDefault();

        if (WEB_APP_URL.includes("SALIN_URL")) {
            alert("Harap masukkan URL Web App Google Apps Script terlebih dahulu di kode script!");
            return;
        }

        const now = new Date();
        const timestamp = now.toLocaleDateString('id-ID', { year: 'numeric', month: '2-digit', day: '2-digit' }) + ' ' + now.toLocaleTimeString('id-ID');

        const newData = {
            timestamp: timestamp,
            tanggal: document.getElementById('tanggal').value,
            teknisi: document.getElementById('teknisi').value,
            lokasi: document.getElementById('lokasi').value,
            pic: document.getElementById('pic').value,
            telp: document.getElementById('telp').value,
            email: document.getElementById('email').value
        };

        // Kirim ke Google Sheets via POST
        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newData)
        }).then(() => {
            // Kirim ke Telegram Opsional
            kirimTelegram(newData);

            alert('Log visit berhasil disimpan ke database cloud!');
            document.getElementById('visitForm').reset();
            
            // Tunggu sebentar lalu refresh data tabel
            setTimeout(fetchDataFromCloud, 2000);
        }).catch(error => {
            alert('Terjadi kesalahan saat menyimpan data.');
            console.error(error);
        });
    });

    function kirimTelegram(data) {
        if (TELEGRAM_BOT_TOKEN.includes("GANTI")) return;
        const pesan = `🚨 *LOG VISIT TEKNISI BARU* 🚨\n\n` +
                      `👤 *Teknisi:* ${data.teknisi}\n` +
                      `🏢 *Lokasi:* ${data.lokasi}\n` +
                      `📅 *Tgl Visit:* ${data.tanggal}\n` +
                      `👤 *PIC:* ${data.pic} (${data.telp})\n` +
                      `📧 *Email:* ${data.email}\n` +
                      `⏰ *Waktu Input:* ${data.timestamp}`;
        
        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: pesan, parse_mode: 'Markdown' })
        }).catch(err => console.log(err));
    }

    // Render Tabel Berdasarkan Filter Bulan
    function renderTable() {
        const filterBulan = document.getElementById('filterBulan').value;
        const tbody = document.getElementById('logTableBody');
        tbody.innerHTML = '';

        const filteredData = logData.filter(item => {
            if (!item.tanggal) return false;
            return item.tanggal.startsWith(filterBulan);
        });

        if (filteredData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Tidak ada data untuk bulan ini</td></tr>';
            return;
        }

        filteredData.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.timestamp || ''}</td>
                <td>${item.tanggal || ''}</td>
                <td>${item.teknisi || ''}</td>
                <td>${item.lokasi || ''}</td>
                <td>${item.pic || ''}</td>
                <td>${item.telp || ''}</td>
                <td>${item.email || ''}</td>
            `;
            tbody.appendChild(row);
        });
    }

    // Sistem Hak Akses Sederhana (Admin vs Teknisi)
    function toggleAdmin() {
        const roleSpan = document.getElementById('userRole');
        const btnExport = document.getElementById('btnExport');
        const toggleLink = document.getElementById('adminToggle');

        if (roleSpan.innerText.includes('Teknisi')) {
            const password = prompt("Masukkan sandi Admin:");
            if (password === "t3lKom2026") { // Sandi admin bisa kamu ubah di sini
                roleSpan.innerText = "Manajemen / Admin";
                btnExport.style.display = "inline-block";
                toggleLink.innerText = "Keluar Admin";
                alert("Berhasil masuk sebagai Admin. Tombol unduh Excel diaktifkan.");
            } else if (password !== null) {
                alert("Sandi salah!");
            }
        } else {
            roleSpan.innerText = "Teknisi Lapangan";
            btnExport.style.display = "none";
            toggleLink.innerText = "Login Admin";
            alert("Keluar dari mode admin.");
        }
    }

    // Fungsi Export Khusus Admin (Format CSV Semicolon)
    function exportExcel() {
        const filterBulan = document.getElementById('filterBulan').value;
        const filteredData = logData.filter(item => item.tanggal && item.tanggal.startsWith(filterBulan));

        if (filteredData.length === 0) {
            alert("Tidak ada data untuk diunduh pada bulan ini.");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,Waktu Input;Tgl Visit;Teknisi;Lokasi;PIC;Telp PIC;Email PIC\r\n";
        filteredData.forEach(item => {
            csvContent += `"${item.timestamp}";"${item.tanggal}";"${item.teknisi}";"${item.lokasi}";"${item.pic}";"${item.telp}";"${item.email}"\r\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Log_Visit_${filterBulan}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
